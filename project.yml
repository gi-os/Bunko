# The Xcode project is generated from this file (xcodegen generate) and never committed.
# New files under a target's source folder are picked up automatically; Info.plist keys and
# entitlements go here too, never in the generated files.
name: Bunko
options:
  bundleIdPrefix: com.gios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Automatic signing for running on your own phone from Xcode; CI signs with match instead.
    DEVELOPMENT_TEAM: J3ZBJXNN9P
    CODE_SIGN_STYLE: Automatic
targets:
  Bunko:
    type: application
    platform: iOS
    sources:
      - path: Bunko
      - path: Shared
    dependencies:
      - target: BunkoWidget
    info:
      path: Bunko/Info.plist
      properties:
        CFBundleDisplayName: Bunko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Bundled typefaces (SIL OFL; licences next to the files in Resources/Fonts).
        UIAppFonts:
          - ShipporiMincho-Regular.ttf
          - ShipporiMincho-Bold.ttf
          - ZenOldMincho-Regular.ttf
          - ZenKakuGothicNew-Regular.ttf
          - Literata.ttf
          - Literata-Italic.ttf
        # Bookshops are often plain-HTTP servers at home (Calibre, Calibre-Web, Kavita on a NAS).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Bunko connects to the book servers you add, like Calibre or Kavita on your home network.
        # "Open in Bunko" for EPUB and text files from Files, Safari and the share sheet.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Plain text
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        ITSAppUsesNonExemptEncryption: false
        # bunko://book/<id>: the widget opens that book on its cover.
        CFBundleURLTypes:
          - CFBundleURLName: com.gios.bunko
            CFBundleURLSchemes: [bunko]
    # iCloud key-value store: reading position, ribbons, covers, settings and bookshops sync.
    # ci/app.env ICLOUD="true" turns the capability on for the bundle ID.
    entitlements:
      path: Bunko/Bunko.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Shared with the widget: the current book and its cover (CurrentBook).
        com.apple.security.application-groups: [group.com.gios.bunko]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.bunko
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  BunkoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BunkoWidget
      - path: Shared
    entitlements:
      path: BunkoWidget/BunkoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gios.bunko]
    info:
      path: BunkoWidget/Info.plist
      properties:
        CFBundleDisplayName: Bunko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (XcodeGen's iOS preset says 1,2 per target)
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.bunko.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  BunkoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BunkoTests
    dependencies:
      - target: Bunko
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.bunko.tests
schemes:
  Bunko:
    build:
      targets:
        Bunko: all
        BunkoTests: [test]
    test:
      targets:
        - BunkoTests
